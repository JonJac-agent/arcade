<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Snake — Arcade</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: #0b0e14;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 24px;
    max-width: 720px;
    margin: 0 auto;
  }

  .back {
    color: #8b95a5;
    text-decoration: none;
    font-size: 14px;
    padding: 8px 12px;
    background: #161b26;
    border: 1px solid #2a3140;
    border-radius: 8px;
    white-space: nowrap;
    transition: color .15s ease, box-shadow .15s ease;
  }

  .back:hover {
    color: #e6edf3;
    box-shadow: 0 0 12px rgba(74, 222, 128, .25);
  }

  .title {
    flex: 1;
    text-align: center;
    margin: 0;
    color: #4ade80;
    font-size: 22px;
    letter-spacing: .5px;
  }

  .hint {
    margin: 0;
    color: #8b95a5;
    font-size: 13px;
    white-space: nowrap;
  }

  main {
    display: flex;
    justify-content: center;
    padding: 8px 16px 48px;
  }

  .card {
    width: min(440px, 100%);
    background: #161b26;
    border: 1px solid #2a3140;
    border-radius: 12px;
    padding: 20px;
    transition: box-shadow .2s ease;
  }

  .card:hover {
    box-shadow: 0 0 20px rgba(74, 222, 128, .12);
  }

  .scorebar {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }

  .stat {
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0b0e14;
    border: 1px solid #2a3140;
    border-radius: 8px;
    padding: 10px 14px;
  }

  .stat .label {
    color: #8b95a5;
    font-size: 13px;
  }

  .stat .value {
    color: #4ade80;
    font-size: 18px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 8px;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(11, 14, 20, .78);
    border-radius: 8px;
  }

  .overlay.hidden {
    display: none;
  }

  .overlay-box {
    text-align: center;
    padding: 24px;
  }

  .overlay-box h2 {
    margin: 0 0 10px;
    color: #4ade80;
    font-size: 26px;
  }

  .overlay-box p {
    margin: 4px 0;
    color: #8b95a5;
    font-size: 15px;
  }

  button {
    margin-top: 16px;
    padding: 10px 22px;
    background: #4ade80;
    color: #0b0e14;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: box-shadow .15s ease, transform .15s ease;
  }

  button:hover {
    box-shadow: 0 0 14px rgba(74, 222, 128, .5);
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(0);
  }

  @media (max-width: 560px) {
    .topbar {
      flex-wrap: wrap;
      gap: 10px;
    }
    .title {
      order: -1;
      flex-basis: 100%;
      text-align: center;
    }
    .hint {
      margin-left: auto;
    }
  }
</style>
</head>
<body>
  <header class="topbar">
    <a class="back" href="index.html">&larr; Arcade</a>
    <h1 class="title">Snake</h1>
    <p class="hint">Arrows / WASD to move &middot; Space to pause</p>
  </header>

  <main>
    <section class="card">
      <div class="scorebar">
        <div class="stat">
          <span class="label">Score</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="stat">
          <span class="label">High Score</span>
          <span class="value" id="high">0</span>
        </div>
      </div>

      <div class="board">
        <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
        <div class="overlay hidden" id="overlay">
          <div class="overlay-box">
            <h2 id="overlay-title">Game Over</h2>
            <p id="overlay-score">Score: 0</p>
            <p id="overlay-high">High Score: 0</p>
            <button type="button" id="restart">Restart</button>
          </div>
        </div>
      </div>
    </section>
  </main>

<script>
(function () {
  'use strict';

  var COLS = 20;
  var ROWS = 20;
  var CELL = 20;
  var BOARD_PX = COLS * CELL; // 400

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');

  // Crisp rendering on high-DPI displays.
  var dpr = window.devicePixelRatio || 1;
  canvas.width = BOARD_PX * dpr;
  canvas.height = BOARD_PX * dpr;
  ctx.scale(dpr, dpr);

  var scoreEl = document.getElementById('score');
  var highEl = document.getElementById('high');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlay-title');
  var overlayScore = document.getElementById('overlay-score');
  var overlayHigh = document.getElementById('overlay-high');
  var restartBtn = document.getElementById('restart');

  var STORAGE_KEY = 'arcade.snake.highScore';

  // localStorage can throw (privacy modes, some file:// contexts) — never let it break the game.
  var store = {
    get: function (key, fallback) {
      try {
        var value = window.localStorage.getItem(key);
        return value === null ? fallback : value;
      } catch (err) {
        return fallback;
      }
    },
    set: function (key, value) {
      try {
        window.localStorage.setItem(key, value);
      } catch (err) {
        /* ignore */
      }
    }
  };

  var DIRS = {
    up:    { x: 0, y: -1 },
    down:  { x: 0, y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1, y: 0 }
  };

  var snake;
  var dir;        // direction applied on the current tick
  var dirQueue;   // buffered upcoming directions (max 2)
  var food;
  var score;
  var highScore;
  var started;    // true once the game has begun moving
  var paused;
  var gameOver;
  var timerId;

  function newGame() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = DIRS.right;
    dirQueue = [];
    score = 0;
    paused = false;
    gameOver = false;
    started = false;
    updateScore();
    spawnFood();
    hideOverlay();
    draw();
  }

  function spawnFood() {
    var occupied = {};
    snake.forEach(function (s) { occupied[s.x + ',' + s.y] = true; });

    var free = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if (!occupied[x + ',' + y]) {
          free.push({ x: x, y: y });
        }
      }
    }

    if (free.length === 0) {
      // Board is full — the player won.
      gameOver = true;
      return;
    }

    food = free[Math.floor(Math.random() * free.length)];
  }

  function interval() {
    // Starts at 150ms per step and speeds up by 3ms per point, with a floor of 60ms.
    return Math.max(60, 150 - score * 3);
  }

  function schedule() {
    clearTimeout(timerId);
    timerId = setTimeout(tick, interval());
  }

  function start() {
    started = true;
    schedule();
  }

  function tick() {
    if (paused || gameOver) {
      return;
    }

    if (dirQueue.length) {
      dir = dirQueue.shift();
    }

    var head = snake[0];
    var nx = head.x + dir.x;
    var ny = head.y + dir.y;

    // Wall collision.
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) {
      endGame(false);
      return;
    }

    var eating = !!food && nx === food.x && ny === food.y;

    // Self collision. When not eating, the tail cell will move away this tick,
    // so it is safe to move into it.
    var body = eating ? snake : snake.slice(0, -1);
    for (var i = 0; i < body.length; i++) {
      if (body[i].x === nx && body[i].y === ny) {
        endGame(false);
        return;
      }
    }

    snake.unshift({ x: nx, y: ny });

    if (eating) {
      score++;
      if (score > highScore) {
        highScore = score;
        store.set(STORAGE_KEY, String(highScore));
      }
      updateScore();
      spawnFood();
      if (gameOver) {
        endGame(true); // filled the board
        return;
      }
    } else {
      snake.pop();
    }

    draw();
    schedule();
  }

  function endGame(won) {
    gameOver = true;
    clearTimeout(timerId);
    showOverlay(won);
  }

  function tryQueue(next) {
    var last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;

    // Ignore exact 180° reversals and duplicates of the pending direction.
    if (next.x === -last.x && next.y === -last.y) return false;
    if (next.x === last.x && next.y === last.y) return false;

    if (dirQueue.length < 2) {
      dirQueue.push(next);
    }
    return true;
  }

  function updateScore() {
    scoreEl.textContent = String(score);
    highEl.textContent = String(highScore);
  }

  function showOverlay(won) {
    overlayTitle.textContent = won ? 'You Win!' : 'Game Over';
    overlayScore.textContent = 'Score: ' + score;
    var isRecord = score > 0 && score >= highScore;
    overlayHigh.textContent = 'High Score: ' + highScore + (isRecord ? ' · New best!' : '');
    overlay.classList.remove('hidden');
  }

  function hideOverlay() {
    overlay.classList.add('hidden');
  }

  function draw() {
    ctx.clearRect(0, 0, BOARD_PX, BOARD_PX);

    // Background.
    ctx.fillStyle = '#0b0e14';
    ctx.fillRect(0, 0, BOARD_PX, BOARD_PX);

    // Grid lines.
    ctx.strokeStyle = '#1b2230';
    ctx.lineWidth = 1;
    var i;
    for (i = 0; i <= COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL + 0.5, 0);
      ctx.lineTo(i * CELL + 0.5, BOARD_PX);
      ctx.stroke();
    }
    for (i = 0; i <= ROWS; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * CELL + 0.5);
      ctx.lineTo(BOARD_PX, i * CELL + 0.5);
      ctx.stroke();
    }

    // Food.
    if (food) {
      drawCell(food.x, food.y, '#f87171');
    }

    // Snake (head is brighter).
    snake.forEach(function (seg, index) {
      drawCell(seg.x, seg.y, index === 0 ? '#86efac' : '#4ade80');
    });

    // Pause state.
    if (paused && started && !gameOver) {
      ctx.fillStyle = 'rgba(11, 14, 20, .72)';
      ctx.fillRect(0, 0, BOARD_PX, BOARD_PX);
      ctx.fillStyle = '#e6edf3';
      ctx.font = '600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Paused', BOARD_PX / 2, BOARD_PX / 2);
      ctx.textAlign = 'start';
      ctx.textBaseline = 'alphabetic';
    }
  }

  function drawCell(x, y, color) {
    var pad = 1;
    var radius = 4;
    ctx.fillStyle = color;
    ctx.beginPath();
    roundRect(x * CELL + pad, y * CELL + pad, CELL - pad * 2, CELL - pad * 2, radius);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    var rr = Math.min(r, w / 2, h / 2);
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  var KEYMAP = {
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right'
  };

  function onKeyDown(e) {
    var name = KEYMAP[e.code];
    if (name) {
      e.preventDefault();
      if (gameOver) return;
      if (tryQueue(DIRS[name]) && !started) start();
      return;
    }

    if (e.code === 'Space') {
      e.preventDefault();
      if (gameOver) return;
      if (!started) {
        start();
        return;
      }
      paused = !paused;
      if (paused) {
        clearTimeout(timerId);
      } else {
        schedule();
      }
      draw();
    }
  }

  restartBtn.addEventListener('click', function () {
    restartBtn.blur();
    newGame();
    start();
  });

  window.addEventListener('keydown', onKeyDown);

  // Load persisted high score and set up the first board.
  highScore = parseInt(store.get(STORAGE_KEY, '0'), 10) || 0;
  newGame();
})();
</script>
</body>
</html>
